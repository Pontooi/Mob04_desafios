<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio 3 — Forma de Entrega</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    h2 {
      color: #14532d;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 24px;
    }

    .opcao {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      font-size: 1rem;
      color: #334155;
    }

    .opcao:hover { border-color: #16a34a; }

    .opcao:has(input:checked) {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }

    input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #16a34a;
      cursor: pointer;
    }

    button {
      background-color: #16a34a;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover { background-color: #15803d; }
    button:active { transform: scale(0.97); }

    #totalTexto {
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 20px;
      color: #14532d;
      background: #f0fdf4;
      border-radius: 12px;
      padding: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🛵 Forma de Entrega</h2>

    <label class="opcao">
      <input type="radio" name="entrega" id="balcao" checked>
      Balcão (Grátis)
    </label>

    <label class="opcao">
      <input type="radio" name="entrega" id="delivery">
      Delivery (+ R$ 8,00)
    </label>

    <button onclick="calcularFrete()">Calcular Total</button>
    <p id="totalTexto">Total: R$ 20,00</p>
  </div>

  <script>
    function calcularFrete() {
      let isDelivery = document.getElementById("delivery").checked;
      let total;

      if (isDelivery) {
        total = "Total com Frete: R$ 28,00";
      } else {
        total = "Total: R$ 20,00";
      }

      document.getElementById("totalTexto").innerText = total;
    }
  </script>
</body>
</html>
